services:
  tickethub_postgres:
    image: postgres:16-alpine
    container_name: tickethub_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=tickethub
    ports:
      # Host port 5433 avoids clashing with other local PostgreSQL instances on 5432.
      - "5433:5432"
    volumes:
      - tickethub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tickethub"]
      interval: 5s
      timeout: 5s
      retries: 5

  tickethub_redis:
    image: redis:7-alpine
    container_name: tickethub_redis
    ports:
      # Host port 6380 avoids clashing with other local Redis instances on 6379.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always

volumes:
  tickethub_pgdata:
