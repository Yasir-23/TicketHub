services:
  tickethub_postgres:
    image: postgres:16-alpine
    container_name: tickethub_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=tickethub
    ports:
      # Host port 5433 avoids clashing with other local PostgreSQL instances on 5432.
      - "5433:5432"
    volumes:
      - tickethub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tickethub"]
      interval: 5s
      timeout: 5s
      retries: 5

  tickethub_redis:
    image: redis:7-alpine
    container_name: tickethub_redis
    ports:
      # Host port 6380 avoids clashing with other local Redis instances on 6379.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always

  tickethub_api:
    build:
      context: .
      dockerfile: src/TicketHub.Api/Dockerfile
    container_name: tickethub_api
    ports:
      # Host port 5001 avoids clashing with other local services on 5000.
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=tickethub_postgres;Port=5432;Database=tickethub;Username=postgres;Password=postgres
      - ConnectionStrings__Redis=tickethub_redis:6379
      - Jwt__SigningKey=SuperSecretTicketHubEnterpriseKey2026!MustBe32CharsLong
      - Jwt__Issuer=TicketHub
      - Jwt__Audience=TicketHubAudience
      - SeedAdmin__Email=${TICKETHUB_ADMIN_EMAIL:-admin@tickethub.com}
      - SeedAdmin__Password=${TICKETHUB_ADMIN_PASSWORD:-AdminSecurePassword123!}
    depends_on:
      tickethub_postgres:
        condition: service_healthy
      tickethub_redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  tickethub_pgdata:
